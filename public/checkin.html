<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B0F0E">
<title>Gym Check-In · Gymblix</title>
<link rel="icon" type="image/png" href="assets/gymblix-favicon.png">
<!-- Members scan the gym's QR (from the Gymblix app) and land here. This page
     talks to the Supabase "gym-checkin" edge function. -->
<style>
  :root { --bg:#0B0F0E; --card:#141A17; --border:#232C27; --volt:#C6FF00; --text:#F5F7F5; --muted:#9CA3A0; --err:#FF6B6B; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 16px;
  }
  .card { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--border); border-radius: 22px; padding: 32px 22px 26px; text-align: center; }
  .mark { width: 56px; height: 56px; margin: 0 auto 14px; display: block; }
  .eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  h1 { font-size: 24px; font-weight: 800; margin: 6px 0 4px; line-height: 1.2; word-wrap: break-word; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  form { text-align: left; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
  input[type=tel] {
    width: 100%; font: inherit; font-size: 20px; letter-spacing: .06em; color: var(--text);
    background: var(--bg); border: 1.5px solid var(--border); border-radius: 12px; padding: 14px 16px; outline: none;
  }
  input[type=tel]:focus { border-color: var(--volt); }
  .remember { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; color: var(--muted); font-weight: 500; }
  .remember input { width: 18px; height: 18px; accent-color: var(--volt); }
  button {
    width: 100%; margin-top: 18px; padding: 16px; border: 0; border-radius: 12px; cursor: pointer;
    background: var(--volt); color: #0B0F0E; font: inherit; font-size: 17px; font-weight: 800;
  }
  button:disabled { opacity: .6; cursor: default; }
  .msg { min-height: 20px; margin-top: 12px; font-size: 14px; color: var(--err); text-align: center; }
  .result .big { width: 84px; height: 84px; border-radius: 50%; margin: 4px auto 16px; display: flex; align-items: center; justify-content: center; background: rgba(198,255,0,.12); }
  .result .big svg { width: 44px; height: 44px; }
  .result h1 { font-size: 26px; }
  .result .time { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .result.err .big { background: rgba(255,107,107,.12); }
  .link { display: inline-block; margin-top: 20px; color: var(--volt); font-weight: 600; font-size: 14px; background: none; border: 0; width: auto; padding: 6px; }
  .foot { margin-top: 18px; font-size: 12px; color: var(--muted); }
  .foot a { color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <main class="card">
    <svg class="mark" viewBox="60 60 392 392" aria-hidden="true">
      <defs><mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512"><rect width="512" height="512" fill="#fff"/><path d="M286 132 L182 278 H246 L218 384 L330 232 H266 Z" fill="#000" stroke="#000" stroke-width="28" stroke-linejoin="round"/></mask></defs>
      <g mask="url(#m)"><path d="M364 150 A150 150 0 1 0 406 262 H318" fill="none" stroke="#C6FF00" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/></g>
      <path d="M286 132 L182 278 H246 L218 384 L330 232 H266 Z" fill="#C6FF00"/>
    </svg>

    <!-- Step 1: phone number -->
    <section id="ask">
      <p class="eyebrow">Check in at</p>
      <h1 id="gym-name">your gym</h1>
      <p class="sub">Enter the phone number registered at the gym.</p>
      <form id="form" novalidate>
        <label for="phone">Phone number</label>
        <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="16" placeholder="98xxxxxxxx" required>
        <label class="remember"><input type="checkbox" id="remember" checked> Remember my number on this phone</label>
        <button id="go" type="submit">Check in ✓</button>
        <p class="msg" id="msg" role="alert"></p>
      </form>
    </section>

    <!-- Step 2: result -->
    <section id="done" class="result" hidden>
      <div class="big" id="done-icon"></div>
      <h1 id="done-title"></h1>
      <p class="sub" id="done-text" style="margin:6px 0 0"></p>
      <p class="time" id="done-time"></p>
      <button class="link" id="again" type="button">Not you? Check in another number</button>
    </section>
  </main>
  <p class="foot">Powered by <a href="/">Gymblix</a></p>

<script>
(function () {
  var API = 'https://jpvtrcjfpsctwlhdzvtr.supabase.co/functions/v1/gym-checkin';
  var KEY = 'gymblix-checkin-phone';
  var gym = new URLSearchParams(location.search).get('gym') || '';
  var $ = function (id) { return document.getElementById(id); };
  var OK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="#C6FF00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var ERR_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>';

  function store(get, val) {
    try { return get ? localStorage.getItem(KEY) : (val ? localStorage.setItem(KEY, val) : localStorage.removeItem(KEY)); }
    catch (e) { return null; }
  }
  function show(id) { $('ask').hidden = id !== 'ask'; $('done').hidden = id !== 'done'; }
  function result(ok, title, text) {
    $('done').className = 'result' + (ok ? '' : ' err');
    $('done-icon').innerHTML = ok ? OK_ICON : ERR_ICON;
    $('done-title').textContent = title;
    $('done-text').textContent = text;
    $('done-time').textContent = ok ? new Date().toLocaleString('en-IN', {weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit'}) : '';
    $('again').textContent = ok ? 'Not you? Check in another number' : '← Try again';
    show('done');
  }

  if (!/^[0-9a-f-]{36}$/i.test(gym)) {
    result(false, 'QR code not valid', 'Please scan the QR code at your gym again, or ask the gym staff.');
    $('again').hidden = true;
    return;
  }

  var saved = store(true);
  if (saved) $('phone').value = saved;

  fetch(API + '?gym=' + gym + '&format=json')
    .then(function (r) { return r.json().then(function (j) { return {ok: r.ok, j: j}; }); })
    .then(function (res) {
      if (res.ok && res.j.gym_name) { $('gym-name').textContent = res.j.gym_name; document.title = 'Check in · ' + res.j.gym_name; }
      else if (!res.ok) { result(false, 'QR code not valid', res.j.error || 'Please ask the gym staff.'); $('again').hidden = true; }
    })
    .catch(function () {});

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var phone = $('phone').value.replace(/\D/g, '').replace(/^(91|0)(?=\d{10}$)/, '');
    if (!/^\d{10}$/.test(phone)) { $('msg').textContent = 'Please enter your 10-digit phone number.'; return; }
    $('msg').textContent = '';
    $('go').disabled = true; $('go').textContent = 'Checking in…';
    fetch(API + '?gym=' + gym, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({phone: phone})})
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j.ok) {
          store(false, $('remember').checked ? phone : null);
          if (j.status === 'already') result(true, 'Already checked in', 'Hi ' + j.name + ', you checked in earlier today. Have a great workout!');
          else result(true, 'Welcome, ' + j.name + '!', 'Your attendance is marked. Have a great workout 💪');
        } else {
          result(false, 'Check-in failed', j.error || 'Please try again.');
        }
      })
      .catch(function () { $('msg').textContent = 'No internet connection? Please try again.'; })
      .then(function () { $('go').disabled = false; $('go').textContent = 'Check in ✓'; });
  });

  $('again').addEventListener('click', function () {
    if ($('done').className.indexOf('err') === -1) { $('phone').value = ''; }
    show('ask'); $('phone').focus();
  });
})();
</script>
</body>
</html>
